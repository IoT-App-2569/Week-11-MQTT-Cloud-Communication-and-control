# กำหนดให้ฟังพอร์ต 8883 สำหรับการเชื่อมต่อเข้ารหัส TLS
listener 8883 0.0.0.0

# ระบุตำแหน่งไฟล์ใบรับรอง (หากเก็บไว้ในโฟลเดอร์เดียวกับไฟล์คอนฟิก หรือระบุ Full Path)
# หมายเหตุ: ใน Windows แนะนำให้ใช้ Forward Slash '/'
cafile C:/Users/tulbp/Desktop/Week-11-MQTT-Cloud-Communication-and-control/67030298/Lab11-3_MQTTS_Secure/ca.crt
certfile C:/Users/tulbp/Desktop/Week-11-MQTT-Cloud-Communication-and-control/67030298/Lab11-3_MQTTS_Secure/server.crt
keyfile C:/Users/tulbp/Desktop/Week-11-MQTT-Cloud-Communication-and-control/67030298/Lab11-3_MQTTS_Secure/server.key

# บังคับการตรวจสอบสิทธิ์สองทาง (Mutual Authentication / mTLS)
require_certificate true

# อนุญาต anonymous เนื่องจากยืนยันตัวตนด้วย Client Certificate แล้ว (mTLS)
allow_anonymous true

# บังคับใช้ TLS เวอร์ชัน 1.2 ขึ้นไป
tls_version tlsv1.2

# บันทึกรายละเอียดการทำงาน
log_type all
