# ==============================================================================
# Mosquitto MQTTS Broker Configuration with Mutual TLS (mTLS) - Lab 11.3
# Student ID: 67030281
# ==============================================================================

# เปิดรับการเชื่อมต่อเข้ารหัส TLS บนพอร์ตมาตรฐาน 8883
listener 8883 0.0.0.0

# กำหนดเส้นทางของใบรับรอง Root CA, Server Certificate และ Private Key
# (หมายเหตุ: ใช้ Forward Slash / สำหรับ Path บน Windows เพื่อความเข้ากันได้)
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key

# บังคับการตรวจสอบสิทธิ์สองทาง (Mutual Authentication / mTLS)
# Client ทุกตัวที่ต่อเข้ามาจะต้องมี Client Certificate ที่ลงนามโดย Root CA นี้
require_certificate true

# กำหนดให้ใช้โปรโตคอล TLS เวอร์ชัน 1.2 ขึ้นไป
tls_version tlsv1.2

# บันทึกรายละเอียดการเชื่อมต่อและข้อผิดพลาดทั้งหมด
log_type all
connection_messages true
log_timestamp true

