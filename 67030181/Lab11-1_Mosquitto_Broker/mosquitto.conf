# กำหนดให้ฟังพอร์ต 1883 บนทุก Network Interface (IPv4 / 0.0.0.0)
listener 1883 0.0.0.0

# อนุญาตให้ Client เชื่อมต่อได้โดยไม่ต้องใช้ Username/Password (สำหรับการทดลอง)
allow_anonymous true

# บันทึกข้อมูลการทำงานของ Broker อย่างละเอียดทุกเหตุการณ์ (Verbose logging)
log_type all

# แสดงการเชื่อมต่อและตัดการเชื่อมต่อของ Client
connection_messages true

# แสดงเวลาในแต่ละข้อความ Log
log_timestamp true

