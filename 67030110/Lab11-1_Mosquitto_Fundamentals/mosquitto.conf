# กำหนดให้รับการเชื่อมต่อที่พอร์ต 1883 บนทุก Network Interface (IPv4)
listener 1883 0.0.0.0

# อนุญาตให้ Client เชื่อมต่อได้โดยไม่ต้องส่ง Username/Password (สำหรับการทดลอง)
allow_anonymous true

# บันทึกประวัติและข้อความ Log อย่างละเอียด
log_type error
log_type warning
log_type notice
log_type information
log_type all
