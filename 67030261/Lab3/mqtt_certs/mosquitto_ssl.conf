# กำหนดให้ฟังพอร์ต 8883 สำหรับการเชื่อมต่อเข้ารหัส TLS
listener 8883 0.0.0.0

# ระบุตำแหน่งไฟล์ใบรับรอง
cafile /Users/ittikorntongsima/Store/KMITl/IOT/Week-11-MQTT-Cloud-Communication-and-control/67030261/Lab3/mqtt_certs/ca.crt
certfile /Users/ittikorntongsima/Store/KMITl/IOT/Week-11-MQTT-Cloud-Communication-and-control/67030261/Lab3/mqtt_certs/server.crt
keyfile /Users/ittikorntongsima/Store/KMITl/IOT/Week-11-MQTT-Cloud-Communication-and-control/67030261/Lab3/mqtt_certs/server.key

# บังคับการตรวจสอบสิทธิ์สองทาง (Mutual Authentication / mTLS)
require_certificate true

# บังคับใช้ TLS เวอร์ชัน 1.2 ขึ้นไป
tls_version tlsv1.2

# Mosquitto 2.x ปฏิเสธ client ที่ไม่มี username ถ้าไม่ตั้งค่านี้ (ยังบังคับใบรับรองสองทางด้วย require_certificate)
allow_anonymous true

# บันทึกรายละเอียดการทำงาน
log_type all
