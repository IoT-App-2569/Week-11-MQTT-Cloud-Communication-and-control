# กำหนดให้ฟังพอร์ต 8883 สำหรับการเชื่อมต่อเข้ารหัส TLS
listener 8883 0.0.0.0

# ระบุตำแหน่งไฟล์ใบรับรอง (Path สัมพัทธ์กับโฟลเดอร์ที่รัน mosquitto — รันจากโฟลเดอร์ mqtt_certs/)
cafile ca.crt
certfile server.crt
keyfile server.key

# บังคับการตรวจสอบสิทธิ์สองทาง (Mutual Authentication / mTLS)
require_certificate true

# บังคับใช้ TLS เวอร์ชัน 1.2 ขึ้นไป
tls_version tlsv1.2

# บันทึกรายละเอียดการทำงาน
log_type all
log_timestamp_format %H:%M:%S

# Mosquitto 2.x: listener ที่ประกาศเองจะไม่อนุญาต anonymous โดยปริยาย
# เมื่อผ่าน mTLS แล้วถือว่ายืนยันตัวตนด้วยใบรับรอง จึงเปิด allow_anonymous ให้ผ่านชั้น MQTT ได้
allow_anonymous true
