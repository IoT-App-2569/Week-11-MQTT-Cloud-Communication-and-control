# กำหนดให้ฟังพอร์ต 8883 สำหรับการเชื่อมต่อเข้ารหัส TLS
listener 8883 0.0.0.0

# อนุญาตการเชื่อมต่อโดยใช้ Certificate ยืนยันตัวตน (ไม่ใช้ username/password)
allow_anonymous true

# ระบุตำแหน่งไฟล์ใบรับรอง (Relative Path เมื่อรันจากโฟลเดอร์นี้)
cafile ca.crt
certfile server.crt
keyfile server.key

# บังคับการตรวจสอบสิทธิ์สองทาง (Mutual Authentication / mTLS)
require_certificate true

# บังคับใช้ TLS เวอร์ชัน 1.2 ขึ้นไป
tls_version tlsv1.2

# บันทึกรายละเอียดการทำงาน
log_type all
